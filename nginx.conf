server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Coolify/Cloudflare terminan el HTTPS; el contenedor solo sirve HTTP
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 512;

    # Portada en la raíz del dominio
    location = / {
        include /etc/nginx/security.inc;
        add_header Cache-Control "public, max-age=300";
        try_files /fullenvios.html =404;
    }

    # La dirección antigua de prueba redirige a la portada
    location = /fullenvios { return 301 /; }
    location = /fullenvios.html { return 301 /; }

    # Páginas sin extensión (/software-ruteo-ecommerce)
    location / {
        include /etc/nginx/security.inc;
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri.html =404;
    }

    # Imágenes: caché largo
    location /assets/ {
        include /etc/nginx/security.inc;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
